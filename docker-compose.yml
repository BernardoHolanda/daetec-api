name: daetec

services:
  api:
    # target: dev — o estágio com git, que o Dev Container precisa.
    # Sem isso o compose construiria o último estágio (produção, sem git).
    build:
      context: .
      target: dev
    hostname: daetec-api
    user: appuser
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    command: fastapi dev app/main.py --host 0.0.0.0 --port 8000
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
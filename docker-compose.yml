services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: fastapi dev main.py --host 0.0.0.0 --port 8000
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: daetec
      POSTGRES_PASSWORD: daetec_dev
      POSTGRES_DB: daetec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: